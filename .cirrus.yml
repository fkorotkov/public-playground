task:
  alias: tests
  matrix:
    - name: Test Things on x86 🎉
      container:
        image: golang:latest
    - name: Test Things on Arm 🎉
      arm_container:
        image: golang:latest
  optimistic_cache:
    folder: test
    fingerprint_script: echo $RANDOM
    populate_script: mkdir -p test && echo $RANDOM > test/random.txt
    optimistically_restore_on_miss: true
  build_script: echo $CIRRUS_BUILD_NUMBER
